
% ============================================================
% DIAMOND AIRFOIL - EULER 2D STAZIONARIO
% ITERATIVE ANISOTROPIC MESH REFINEMENT
% ============================================================

% Modello e regime
SOLVER= EULER
MATH_PROBLEM= DIRECT
RESTART_SOL= NO
TIME_DOMAIN= NO
ITER= 5000

% Condizioni di flusso (M=2, alpha=0, aria gamma=1.4)
MACH_NUMBER= 2.0
AOA= 0.0
FREESTREAM_TEMPERATURE= 216.65
FREESTREAM_PRESSURE= 5475.0
GAMMA_VALUE= 1.4
REF_DIMENSIONALIZATION= FREESTREAM_VEL_EQ_ONE

% Coefficienti aerodinamici 2D
REF_LENGTH= 1.0
REF_AREA= 1.0

% Condizioni al contorno
MARKER_EULER= ( Airfoil )
MARKER_FAR= ( Farfield )
MARKER_PLOTTING= ( Airfoil )
MARKER_MONITORING= ( Airfoil )

% Schema numerico
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN

TIME_DISCRE_FLOW= EULER_IMPLICIT
CFL_NUMBER= 2.0
CFL_ADAPT= NO

LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-6
LINEAR_SOLVER_ITER= 10

% Convergenza
CONV_FIELD= RMS_DENSITY
CONV_STARTITER= 100
CONV_RESIDUAL_MINVAL= -8

% ============================================================
% INPUT MESH
% ============================================================

% La mesh viene copiata da Python in ogni iterazione
MESH_FILENAME= mesh.su2
MESH_FORMAT= SU2

% ============================================================
% OUTPUT
% ============================================================

TABULAR_FORMAT= CSV

CONV_FILENAME= Results/history
RESTART_FILENAME= Results/restart_flow.dat
SOLUTION_FILENAME= Results/restart_flow.dat

VOLUME_FILENAME= Results/flow
SURFACE_FILENAME= Results/surface_flow

OUTPUT_FILES= ( RESTART, PARAVIEW, SURFACE_PARAVIEW, SURFACE_CSV )
OUTPUT_WRT_FREQ= 1000

VOLUME_OUTPUT= ( COORDINATES, SOLUTION, PRIMITIVE )
HISTORY_OUTPUT= ( ITER, RMS_RES, AERO_COEFF )

SCREEN_OUTPUT= ( INNER_ITER, RMS_DENSITY, RMS_ENERGY, DRAG, LIFT )
SCREEN_WRT_FREQ_INNER= 20
