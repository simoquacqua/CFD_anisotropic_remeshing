% ============================================================
% DIAMOND AIRFOIL - EULER 2D STAZIONARIO - SCHEMA JST
% Ciclo di adattamento anisotropo (adaptation/loop.py)
% ============================================================

% ------------------------------------------------------------
% Modello e regime
% ------------------------------------------------------------
SOLVER= EULER
MATH_PROBLEM= DIRECT           % per l'aggiunto il ciclo lo cambia in DISCRETE_ADJOINT
RESTART_SOL= NO                % ogni iterazione parte dalla corrente uniforme
TIME_DOMAIN= NO
ITER= 20000                    % solo un margine

% ------------------------------------------------------------
% Condizioni di flusso (M = 2, alpha = 0, aria gamma = 1.4)
% ------------------------------------------------------------
MACH_NUMBER= 2.0
AOA= 0.0
FREESTREAM_TEMPERATURE= 216.65
FREESTREAM_PRESSURE= 5475.0
GAMMA_VALUE= 1.4
REF_DIMENSIONALIZATION= FREESTREAM_VEL_EQ_ONE   % rho=1, V=1, T=1 -> p_inf = 1/(gamma M^2) = 0.1786

% ------------------------------------------------------------
% Coefficienti aerodinamici 2D (corda = 1)
% ------------------------------------------------------------
REF_LENGTH= 1.0
REF_AREA= 1.0

% ------------------------------------------------------------
% Condizioni al contorno
% ------------------------------------------------------------
MARKER_EULER= ( Airfoil )
MARKER_FAR= ( Farfield )
MARKER_PLOTTING= ( Airfoil )
MARKER_MONITORING= ( Airfoil )  % superficie su cui si calcolano C_D e C_L (e l'obiettivo dell'aggiunto)

% ------------------------------------------------------------
% Discretizzazione spaziale
% JST: schema centrato con dissipazione artificiale (2o e 4o ordine)
% regolata da un sensore di pressione; niente MUSCL ne' limitatore.
% ------------------------------------------------------------
CONV_NUM_METHOD_FLOW= JST
JST_SENSOR_COEFF= ( 0.5, 0.02 )        % k2, k4 di default; k2 = 1.0 se oscilla agli urti
CENTRAL_JACOBIAN_FIX_FACTOR= 4.0       % default; aumentalo se l'implicito e' instabile

% ------------------------------------------------------------
% Integrazione nel pseudo-tempo
% ------------------------------------------------------------
TIME_DISCRE_FLOW= EULER_IMPLICIT
CFL_NUMBER= 5.0                                      % CFL iniziale
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.1, 1.2, 1.0, 50.0, 0.001, 0 )   % giu', su, min, max, residuo lineare accettabile, iter. iniziale

LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-6
LINEAR_SOLVER_ITER= 30

% ------------------------------------------------------------
% Convergenza
% (il ciclo usa -6 nelle iterazioni intermedie, a meno di
%  --intermediate-residual -8)
% Se il residuo si ferma sopra -8, sostituire le tre righe sotto con:
%   CONV_FIELD= DRAG
%   CONV_CAUCHY_ELEMS= 100
%   CONV_CAUCHY_EPS= 1E-6
%   CONV_STARTITER= 100
% ------------------------------------------------------------
CONV_FIELD= RMS_DENSITY
CONV_STARTITER= 100
CONV_RESIDUAL_MINVAL= -8

% ============================================================
% INPUT / OUTPUT
% Le righe seguenti vengono comunque reimpostate dal ciclo
% (run_su2 in adaptation/loop.py): sono qui per poter lanciare
% questo .cfg anche a mano con SU2_CFD.
% ============================================================
MESH_FILENAME= mesh.su2
MESH_FORMAT= SU2

TABULAR_FORMAT= CSV
CONV_FILENAME= Results/history
RESTART_FILENAME= Results/restart_flow.dat
SOLUTION_FILENAME= Results/restart_flow.dat
VOLUME_FILENAME= Results/flow
SURFACE_FILENAME= Results/surface_flow

OUTPUT_FILES= ( RESTART, PARAVIEW, SURFACE_CSV )
OUTPUT_WRT_FREQ= 1000

VOLUME_OUTPUT= ( COORDINATES, SOLUTION, PRIMITIVE, RESIDUAL )
HISTORY_OUTPUT= ( ITER, RMS_RES, AERO_COEFF )
SCREEN_OUTPUT= ( INNER_ITER, RMS_DENSITY, RMS_ENERGY, DRAG, LIFT, AVG_CFL, LINSOL_ITER, LINSOL_RESIDUAL )
SCREEN_WRT_FREQ_INNER= 100